<!doctype html><html><head><meta charset="utf-8"><title>JavaScript Events</title></head><body><h1>JavaScript Events</h1><button id="dateBtn">Show current date/time</button><p id="date"></p><form id="form"><input id="name" placeholder="Name"><button>Submit</button></form><p id="message"></p><button id="debug">console.log demo</button><button id="set">Set cookie</button><button id="get">Get cookie</button><button id="check">Check cookie</button><p id="cookie"></p><p id="json"></p><script>
document.getElementById('dateBtn').addEventListener('click',()=>document.getElementById('date').textContent=new Date().toLocaleString());
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault(); if(!document.getElementById('name').value.trim()){document.getElementById('message').textContent='Name is required';return;} document.getElementById('message').textContent='Valid form submitted';});
document.getElementById('debug').onclick=()=>{console.log('Debug value:',{time:new Date(),status:'button clicked'}); alert('Open DevTools → Console to see console.log().');};
function setCookie(name,value){document.cookie=name+'='+encodeURIComponent(value)+';max-age=3600;path=/';} function getCookie(name){return document.cookie.split('; ').find(r=>r.startsWith(name+'='))?.split('=')[1]||'';} function checkCookie(name){return document.cookie.split('; ').some(r=>r.startsWith(name+'='));}
document.getElementById('set').onclick=()=>{setCookie('jalaUser','Vinutna');document.getElementById('cookie').textContent='Cookie set';}; document.getElementById('get').onclick=()=>document.getElementById('cookie').textContent='Cookie value: '+decodeURIComponent(getCookie('jalaUser')); document.getElementById('check').onclick=()=>document.getElementById('cookie').textContent='Cookie exists: '+checkCookie('jalaUser');
const user={name:'Vinutna',role:'Learner'}; document.getElementById('json').textContent='JSON dot notation: '+user.name+' – '+user.role;
</script></body></html>
