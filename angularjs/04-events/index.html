<!doctype html><html ng-app="eventApp"><head><meta charset="utf-8"><title>AngularJS Events + MySQL</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script src="app.js"></script></head><body ng-controller="EventCtrl"><h1>AngularJS Events</h1><h2>1. MySQL → Node/Express API → AngularJS</h2><button ng-click="loadStudents()">Fetch MySQL Data</button><p>{{mysqlStatus}}</p><table border="1" ng-if="students.length"><tr><th>ID</th><th>Name</th><th>Course</th></tr><tr ng-repeat="s in students"><td>{{s.id}}</td><td>{{s.name}}</td><td>{{s.course}}</td></tr></table><h2>2. DOM + ng-show/ng-hide/ng-disabled</h2><button ng-click="showBox=!showBox" ng-disabled="disableButton">Toggle</button> <label><input type="checkbox" ng-model="disableButton"> Disable button</label><div ng-show="showBox">ng-show content is visible.</div><div ng-hide="showBox">ng-hide content is visible.</div><h2>3. ng-click, ng-mousemove and $event</h2><button ng-click="clicked($event)">Click me</button><div ng-mousemove="moved($event)" style="height:120px;border:1px solid #333;margin-top:10px">Move mouse here<br>{{mouseText}}</div><p>{{clickText}}</p></body></html>
