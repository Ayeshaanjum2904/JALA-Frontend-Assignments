<!doctype html><html ng-app="validationApp"><head><meta charset="utf-8"><title>AngularJS Elements and Validations</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script><script src="app.js"></script><style>.box{padding:20px;background:#def;margin:10px 0}.box{transition:0.5s linear all;opacity:1;transform:translateY(0)}.box.ng-hide{opacity:0;transform:translateY(-15px)}.page{padding:15px;border:1px solid #aaa;margin-top:10px}input.ng-invalid.ng-touched{border:2px solid red}</style></head><body><h1>AngularJS Elements and Validations</h1><nav><a href="#/home">Home</a> | <a href="#/about">About</a> | <a href="#/missing">Missing route</a></nav><div ng-view class="page"></div><hr><h2>Form elements + validation</h2><div ng-controller="FormCtrl"><form name="userForm" novalidate ng-submit="submit(userForm)"><label>Textbox <input name="name" ng-model="user.name" required></label><span ng-show="userForm.name.$touched && userForm.name.$error.required">Name is required</span><span ng-show="userForm.customName.$touched && userForm.customName.$error.customName">Name must contain at least 3 characters.</span><br><label>Email <input type="email" name="email" ng-model="user.email" required></label><span ng-show="userForm.email.$touched && userForm.email.$error.required">Email is required</span><span ng-show="userForm.email.$touched && userForm.email.$error.email">Enter a valid email</span><br><label>Select <select name="course" ng-model="user.course" required><option value="">Choose</option><option>HTML</option><option>CSS</option><option>AngularJS</option></select></label><br><label><input type="checkbox" ng-model="user.agree"> Agree</label><br><label><input type="radio" ng-model="user.level" value="Beginner"> Beginner</label><label><input type="radio" ng-model="user.level" value="Advanced"> Advanced</label><br><label>Custom validation (name must contain 3+ characters): <input name="customName" ng-model="user.customName" minlength="3" custom-name></label><br><button ng-disabled="userForm.$invalid || !user.agree">Submit</button></form><p>{{formMessage}}</p><h2>Animations with ng-show/ng-hide</h2><button ng-click="show=!show">Toggle animated box</button><div class="box" ng-show="show">Animated ng-show/ng-hide content.</div></div></body></html>
