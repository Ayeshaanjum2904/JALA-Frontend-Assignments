<!doctype html><html><head><meta charset="utf-8"><title>CSS Effects</title><style>body{font-family:Arial;padding:25px}.card{width:220px;padding:15px;box-shadow:0 5px 18px #777;border:1px solid #ddd}.card:hover{box-shadow:0 8px 25px #333}.animate{width:80px;height:80px;background:#4b8;margin:20px 0;animation:move 3s ease 1s infinite alternate}@keyframes move{from{transform:translateX(0)}to{transform:translateX(220px)}}.pagination a{display:inline-block;padding:8px 12px;margin:2px;border:1px solid #888;text-decoration:none}.pagination a:hover{background:#ddd}.pagination.spaced a{margin:8px}.positions{height:180px;border:1px solid #333;position:relative}.static{position:static}.relative{position:relative;left:20px}.absolute{position:absolute;right:10px;top:60px}.fixed{position:fixed;right:10px;bottom:10px;background:#ffd;padding:8px}.sticky{position:sticky;top:0;background:#def;padding:8px}.overflow{width:250px;height:80px;overflow:scroll;border:1px solid #333}.opacity img{width:250px;opacity:.5}</style></head><body><h1>CSS Effects</h1><div class="card">Shadow effect. Hover me.</div><div class="animate">Animate</div><div class="pagination"><a href="#">1</a><a href="#">2</a><a href="#">3</a></div><div class="pagination spaced"><a href="#">A</a><a href="#">B</a><a href="#">C</a></div><div class="sticky">Sticky element</div><div class="positions"><div class="static">static</div><div class="relative">relative</div><div class="absolute">absolute</div></div><div class="fixed">fixed</div><h2>Overflow scroll</h2><div class="overflow">This is deliberately long content to demonstrate overflow scroll behavior when the content exceeds the box dimensions. Keep scrolling.</div><div class="opacity"><h2>Opacity</h2><img src="https://picsum.photos/250/120" alt="Opacity"></div></body></html>
